<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxelwerk Prüfbogen</title>
<link rel="icon" href="data:,">
<!--
  Prüfbogen-Ansicht (Kontaktbogen) zu tools/pruefbogen.mjs.
  ?id=<modell>[&datei=<rezept.json relativ zum Projekt>][&params=k=v,…][&out=<berichtsordner>][&elev=35&az=35][&cell=170]
      liest den Bericht shots/pruefbogen/<id>.json (Fälle + Prüfergebnisse) und rendert jeden Fall.
  ?silhouette=<figurenordner>[&pose=stand]
      alle Figuren unter assets/figures/<ordner>/ schwarz auf hell, Spielkamera 57°, in einer Reihe.
  Fertig-Signal für Playwright: window.__ready === true.
-->
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
</script>
<style>
  :root { --bg:#12151c; --panel:#1a1f29; --line:#2a3242; --text:#e8e4d8; --muted:#8e9aab; --accent:#d4a23a; --ok:#8fd06a; --warn:#e6b84a; --err:#ff6b5e; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font: 12px/1.35 system-ui, "Segoe UI", sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0 0 4px; font-size:16px; } header h1 b { color:var(--accent); }
  header .meta { color:var(--muted); }
  #summary { margin-top:6px; font-weight:600; } #summary.ok { color:var(--ok); } #summary.err { color:var(--err); }
  #modelerr { color:var(--err); margin-top:4px; }
  #msg { padding:8px 16px; color:var(--err); white-space:pre-wrap; } #msg:empty { display:none; }
  section { padding:8px 16px 4px; }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:8px 0 6px; }
  .row { display:flex; gap:6px; align-items:flex-start; margin-bottom:8px; }
  .rowlabel { flex:0 0 120px; color:var(--muted); padding-top:6px; font-family: ui-monospace, Consolas, monospace; }
  .cells { display:flex; flex-wrap:wrap; gap:6px; }
  .cell { width:var(--cell); background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .cell.err { border-color:var(--err); box-shadow: inset 0 0 0 1px var(--err); }
  .cell.warn { border-color:var(--warn); }
  .cell canvas { display:block; width:var(--cell); height:var(--cell); background:#202634; }
  .cap { padding:3px 5px 4px; font: 10.5px/1.3 ui-monospace, Consolas, monospace; }
  .cap .t { color:var(--text); font-weight:600; }
  .cap .n { color:var(--muted); }
  .cap .e { color:var(--err); } .cap .w { color:var(--warn); }
  .legend { color:var(--muted); padding:0 16px 12px; }
  .legend i { display:inline-block; width:10px; height:10px; vertical-align:-1px; margin:0 4px 0 12px; border-radius:2px; }
  /* Silhouette */
  body.sil { background:#ECE8DC; color:#1b1b1b; }
  body.sil header { background:#E2DDCF; border-color:#cfc8b6; } body.sil header .meta { color:#5d5a52; }
  #silwrap { position:relative; margin:12px 16px; }
  #silwrap canvas { display:block; background:#ECE8DC; }
  .flabel { position:absolute; transform:translateX(-50%); font: 11px ui-monospace, Consolas, monospace; color:#333; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1><b>PRÜF</b>BOGEN <span id="title"></span></h1>
  <div class="meta" id="meta"></div>
  <div id="summary"></div>
  <div id="modelerr"></div>
</header>
<div id="msg"></div>
<main id="main"></main>
<div class="legend" id="legend"></div>
<script type="module">
import * as THREE from 'three';
import { Library } from '../core/library.js';
import { modelObject, figureObject, applyPose } from '../render/voxel-three.js';

const $ = (s) => document.querySelector(s);
const ROOT = new URL('../', import.meta.url).href;
const io = {
  json: async (p) => { const r = await fetch(ROOT + p, { cache: 'no-store' }); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.json(); },
  binary: async (p) => { const r = await fetch(ROOT + p, { cache: 'no-store' }); if (!r.ok) throw new Error(`${p}: HTTP ${r.status}`); return r.arrayBuffer(); },
};
const lib = new Library(io);
const url = new URLSearchParams(location.search);
const D2R = Math.PI / 180;
const CELL = +(url.get('cell') || 170);
document.documentElement.style.setProperty('--cell', CELL + 'px');
window.__ready = false;
const done = () => requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
const fail = (e) => { $('#msg').textContent = String(e?.message || e); console.error(e); done(); };
const fmt = (x) => (x ?? 0).toFixed(2).replace('.', ',');

// Ortho-Kamera, die eine Box aus Richtung (elev, az) ganz zeigt; Rückgabe: Kamera + Seitenverhältnis-Ausgleich
function orthoFor(box, elev, az, aspect, pad = 1.08) {
  const e = elev * D2R, a = az * D2R;
  const dir = new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
  const c = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length() + 2;
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, R * 4);
  cam.position.copy(c).addScaledVector(dir, R * 2); cam.lookAt(c); cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse, p = new THREE.Vector3();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < 8; i++) {
    p.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(inv);
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  let w = (x1 - x0) * pad, h = (y1 - y0) * pad;
  if (w / h < aspect) w = h * aspect; else h = w / aspect;
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  Object.assign(cam, { left: mx - w / 2, right: mx + w / 2, top: my + h / 2, bottom: my - h / 2 });
  cam.updateProjectionMatrix();
  return cam;
}

function lights(scene, strong = true) {
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3328, strong ? 1.6 : 1));
  const sun = new THREE.DirectionalLight(0xfff2dc, strong ? 2.4 : 1.5); sun.position.set(4, 9, 6); scene.add(sun);
}

// ---------------------------------------------------------------------------------------------
// Kontaktbogen
// ---------------------------------------------------------------------------------------------
async function contactSheet(id) {
  const datei = url.get('datei');
  if (datei) { const obj = await io.json(datei); await lib.put('models', obj); }
  else await lib.load('models', id);
  const model = lib.get('models', id);
  const outDir = (url.get('out') || 'shots/pruefbogen').replace(/\/+$/, '');
  const rep = await io.json(`${outDir}/${id}.json`).catch(() => null);
  if (!rep) throw new Error(`Kein Bericht ${outDir}/${id}.json – zuerst: node tools/pruefbogen.mjs ${id}${datei ? ' --datei ' + datei : ''}`);
  document.title = `Prüfbogen ${id}`;
  $('#title').textContent = id;
  $('#meta').textContent = `${model.name || ''} · Kachelart ${rep.kind || '–'} · ${rep.tier} · Grundfläche ${rep.footprint.join('×')} m · Budget ${rep.budget} Dreiecke · ${rep.cases.length} Fälle · Bericht ${rep.erstellt?.slice(0, 16).replace('T', ' ') || ''}${Object.keys(rep.fixed || {}).length ? ' · fest: ' + Object.entries(rep.fixed).map(([k, v]) => k + '=' + v).join(', ') : ''}`;
  const s = $('#summary');
  s.textContent = rep.errors ? `✗ ${rep.errors} Fehler, ${rep.warnings} Warnungen` : `✓ keine Fehler, ${rep.warnings} Warnungen`;
  s.className = rep.errors ? 'err' : 'ok';
  $('#modelerr').textContent = (rep.modelErrors || []).map((m) => '✗ ' + m).join('\n');
  $('#legend').innerHTML = 'Boden: <i style="background:#7d8796"></i>Kachel/Grundfläche <i style="background:#d4a23a"></i>conn-Kante (Anschluss) <i style="background:#5fa8ff"></i>Türzone 2 m (offen) · Rahmen rot = Fehler, gelb = Warnung';

  // Gemeinsamer Bildausschnitt über alle Fälle (gleicher Maßstab → Höhen vergleichbar)
  const fp = rep.footprint, union = new THREE.Box3(new THREE.Vector3(-fp[0] / 2, 0, -fp[1] / 2), new THREE.Vector3(fp[0] / 2, 0.05, fp[1] / 2));
  for (const c of rep.cases) if (c.bounds) union.union(new THREE.Box3(new THREE.Vector3(...c.bounds.min), new THREE.Vector3(...c.bounds.max)));
  const elev = +(url.get('elev') || 35), az = +(url.get('az') || 35);
  const cam = orthoFor(union, elev, az, 1);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(CELL, CELL, false);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x202634);
  lights(scene);

  // Bodenhilfen
  const flat = (w, d, color, x, z, y = 0.004) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); return m; };
  const tile = new THREE.Group();
  const B = 0.03, hw = fp[0] / 2, hd = fp[1] / 2;
  tile.add(flat(fp[0], B, 0x7d8796, 0, -hd), flat(fp[0], B, 0x7d8796, 0, hd), flat(B, fp[1], 0x7d8796, -hw, 0), flat(B, fp[1], 0x7d8796, hw, 0));
  scene.add(tile);
  const connMarks = { 1: flat(0.5, 0.12, 0xd4a23a, 0, -hd - 0.08, 0.006), 2: flat(0.12, 0.5, 0xd4a23a, hw + 0.08, 0, 0.006), 4: flat(0.5, 0.12, 0xd4a23a, 0, hd + 0.08, 0.006), 8: flat(0.12, 0.5, 0xd4a23a, -hw - 0.08, 0, 0.006) };
  Object.values(connMarks).forEach((m) => scene.add(m));
  const doorZone = flat(2, fp[1], 0x5fa8ff, 0, 0, 0.005); doorZone.material.opacity = 0.35; scene.add(doorZone);

  const main = $('#main');
  const sections = new Map();
  const defaults = Object.fromEntries(Object.entries(model.params || {}).map(([k, d]) => [k, d.default]));
  for (const c of rep.cases) {
    if (!sections.has(c.section)) { const sec = document.createElement('section'); sec.innerHTML = `<h2>${c.section}</h2>`; main.appendChild(sec); sections.set(c.section, { sec, rows: new Map() }); }
    const S = sections.get(c.section);
    if (!S.rows.has(c.row)) {
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<div class="rowlabel">${c.row === 'variants' ? '' : c.row}</div><div class="cells"></div>`;
      S.sec.appendChild(row); S.rows.set(c.row, row.querySelector('.cells'));
    }
    const cell = document.createElement('div');
    cell.className = 'cell' + (c.errors.length ? ' err' : c.warnings.length ? ' warn' : '');
    const cv = document.createElement('canvas'); cv.width = CELL; cv.height = CELL; cell.appendChild(cv);
    const conn = c.params.conn ?? defaults.conn;
    const dirs = conn != null ? ` <span class="n">${['N', 'O', 'S', 'W'].filter((_, i) => conn & (1 << i)).join('') || '–'}</span>` : '';
    const cap = document.createElement('div'); cap.className = 'cap';
    cap.innerHTML = `<div class="t">${c.label}${c.section === 'Anschlüsse' ? dirs : ''}</div>`
      + `<div class="n">▲ ${fmt(c.heightM)} m · ${c.tris ?? '–'} △${c.clearM != null ? ' · licht ' + fmt(c.clearM) + ' m' : ''}</div>`
      + c.errors.map((m) => `<div class="e">✗ ${m}</div>`).join('') + c.warnings.map((m) => `<div class="w">! ${m}</div>`).join('');
    cell.title = JSON.stringify(c.params);
    cell.appendChild(cap);
    S.rows.get(c.row).appendChild(cell);

    // Rendern
    let obj;
    try { obj = modelObject(lib, id, { params: c.params, castShadow: false }); }
    catch (e) { cap.insertAdjacentHTML('beforeend', `<div class="e">✗ ${e.message}</div>`); continue; }
    scene.add(obj);
    for (const [bit, m] of Object.entries(connMarks)) m.visible = conn != null && !!(conn & +bit);
    doorZone.visible = c.clearM != null;
    renderer.render(scene, cam);
    cv.getContext('2d').drawImage(renderer.domElement, 0, 0);
    scene.remove(obj);
    if (rep.cases.indexOf(c) % 12 === 11) await new Promise((r) => setTimeout(r, 0));
  }
  done();
}

// ---------------------------------------------------------------------------------------------
// Silhouetten: alle Figuren eines Ordners schwarz auf hell, Spielkamera 57°
// ---------------------------------------------------------------------------------------------
async function silhouettes(folder) {
  document.body.classList.add('sil');
  const pose = url.get('pose') || 'stand';
  const index = await (await fetch(ROOT + 'api/index', { cache: 'no-store' })).json();
  const ids = (index.figures || []).filter((f) => f.startsWith(folder.replace(/\/$/, '') + '/'));
  document.title = `Silhouetten ${folder}`;
  $('#title').textContent = `Silhouetten ${folder}`;
  $('#meta').textContent = `${ids.length} Figuren · Pose ${pose} · Spielkamera elev 57°, az 0 · schwarz auf hell (Lesbarkeitstest: Rolle = Silhouette)`;
  if (!ids.length) throw new Error(`Keine Figuren unter assets/figures/${folder}/`);
  await Promise.all(ids.map((f) => lib.load('figures', f)));

  const black = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xECE8DC);
  const row = new THREE.Group(); scene.add(row);
  const GAP = 1.5, figs = [];
  ids.forEach((fid, i) => {
    const f = figureObject(lib, fid, { phase: 0 });
    f.pose = pose; applyPose(f, pose, 0);
    f.root.traverse((m) => { if (m.isMesh) { m.material = black; m.castShadow = false; } });
    f.root.position.x = i * GAP;
    row.add(f.root); figs.push({ fid, root: f.root });
  });
  row.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(row);
  const W = Math.min(1760, Math.max(600, ids.length * 190)), H = 460;
  const cam = orthoFor(box, 57, 0, W / H, 1.12);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  const wrap = document.createElement('div'); wrap.id = 'silwrap'; wrap.style.width = W + 'px'; wrap.style.height = (H + 36) + 'px';
  wrap.appendChild(renderer.domElement); $('#main').appendChild(wrap);
  renderer.render(scene, cam);
  const v = new THREE.Vector3();
  for (const { fid, root } of figs) {
    v.set(root.position.x, box.min.y, 0).project(cam);
    const l = document.createElement('div'); l.className = 'flabel';
    l.style.left = ((v.x + 1) / 2 * W) + 'px'; l.style.top = (H + 8) + 'px';
    l.textContent = fid.slice(folder.length + 1);
    wrap.appendChild(l);
  }
  done();
}

try {
  if (url.get('silhouette')) await silhouettes(url.get('silhouette'));
  else if (url.get('id')) await contactSheet(url.get('id'));
  else throw new Error('Parameter fehlt: ?id=<modell> oder ?silhouette=<figurenordner>');
} catch (e) { fail(e); }
</script>
</body>
</html>
